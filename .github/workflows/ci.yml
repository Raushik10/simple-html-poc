name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/web" >> "$GITHUB_ENV"
      - name: Lint chart
        run: helm lint deploy/helm/web -f deploy/envs/staging/values.yaml
      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=${{ github.sha }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$IMAGE:${{ github.sha }}" app
      - name: Scan image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:${{ github.sha }}"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push image
        if: github.event_name == 'push'
        run: docker push "$IMAGE:${{ github.sha }}"

  deploy-staging:
    if: github.event_name == 'push'
    needs: build
    runs-on: [self-hosted, minikube]
    environment: staging
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/web" >> "$GITHUB_ENV"
      - name: Use minikube
        run: kubectl config use-context poc
      - name: Pull secret
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl -n staging create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io --docker-username="$GHCR_USER" \
            --docker-password="$GHCR_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy
        run: |
          helm upgrade --install web deploy/helm/web -n staging \
            -f deploy/envs/staging/values.yaml \
            --set image.repository="$IMAGE" --set image.tag="${{ github.sha }}" \
            --atomic --timeout 3m
      - name: Smoke test
        run: helm test web -n staging --timeout 2m
